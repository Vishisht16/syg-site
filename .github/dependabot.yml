version: 2
updates:
  # Monthly, one pull request per ecosystem. A version is proposed once it
  # has been out for two weeks. A new major version of a package changes how
  # it is used, so it is taken by hand, not proposed here.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
